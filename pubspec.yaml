name: circle_flags
description: A collection of round flags
version: 7.0.0
repository: https://github.com/cedvdb/flutter_circle_flags
issue_tracker: https://github.com/cedvdb/flutter_circle_flags/issues

topics:
  - flags
  - country-flags
  - svg

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  material_ui: ^1.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path: any

flutter:
  assets:
    - assets/svg/
