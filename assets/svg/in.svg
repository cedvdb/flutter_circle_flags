      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(270 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(285 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(300 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(315 150 100)"/>
