<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="600"
     viewBox="0 0 300 200"
     role="img" aria-labelledby="title desc">
  <title id="title">Flag of India (Tiranga)</title>
  <desc id="desc">Three horizontal bands of saffron, white and green with a navy 24-spoke Ashoka Chakra in the center.</desc>

  <rect x="0" y="0" width="300" height="66.6666667" fill="#FF9933"/>

  <rect x="0" y="66.6666667" width="300" height="66.6666667" fill="#FFFFFF"/>

  <rect x="0" y="133.3333334" width="300" height="66.6666667" fill="#138808"/>


  <g id="chakra" transform="translate(0,0)">
    <circle cx="150" cy="100" r="20" fill="none" stroke="#000080" stroke-width="2"/>

    <circle cx="150" cy="100" r="2.2" fill="#000080"/>

    <g stroke="#000080" stroke-width="1" stroke-linecap="round">
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(0 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(15 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(30 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(45 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(60 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(75 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(90 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(105 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(120 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(135 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(150 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(165 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(180 150 100)"/>
      <line x1="150" y1="80" x2="150" y2="120" transform="rotate(195 150 100)"/>
